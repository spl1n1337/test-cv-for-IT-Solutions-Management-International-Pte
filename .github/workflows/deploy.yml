name: Deploy

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload project to the VM
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key "yc-user@${SSH_HOST}" "mkdir -p /home/yc-user/app"
          rsync -az --delete \
            --exclude .env \
            --exclude .git \
            --exclude node_modules \
            --exclude dist \
            --exclude prisma/generated \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ "yc-user@${SSH_HOST}:/home/yc-user/app/"

      - name: Build and restart containers
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "yc-user@${SSH_HOST}" "cd /home/yc-user/app && if [ ! -f .env ]; then printf 'HTTP_PORT=4000\n' > .env; fi && sudo docker compose up --build -d"
